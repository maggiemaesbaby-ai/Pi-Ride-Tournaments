<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Shooter - Pi Arcade</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #game-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
    <div id="game-container"></div>
    
    <!-- Load Phaser 3 -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    
    <!-- Load game files -->
    <script src="GameSettings.js"></script>
    <script src="ParticleManager.js"></script>
    <script src="Player.js"></script>
    <script src="Enemy.js"></script>
    <script src="Weapon.js"></script>
    <script src="PreloadScene.js"></script>
    <script src="GameScene.js"></script>
    <script src="GameOverScene.js"></script>
    
    <script>
        // Pi Arcade Tournament Integration
        let tournamentScore = 0;
        let tournamentLives = 3;
        let isGameOver = false;

        // Phaser game configuration
        const config = {
            type: Phaser.AUTO,
            width: 800,
            height: 600,
            parent: 'game-container',
            physics: {
                default: 'arcade',
                arcade: {
                    gravity: { y: 0 },
                    debug: false
                }
            },
            scene: [PreloadScene, GameScene, GameOverScene],
            callbacks: {
                postBoot: function (game) {
                    // Send initial game state to parent
                    window.parent.postMessage({
                        type: 'GAME_READY',
                        gameId: 'space-shooter'
                    }, '*');
                }
            }
        };

        const game = new Phaser.Game(config);

        // Listen for commands from parent (pause/resume)
        window.addEventListener('message', (event) => {
            if (event.data.type === 'PAUSE_GAME') {
                game.scene.scenes.forEach(scene => {
                    if (scene.scene.isActive()) {
                        scene.scene.pause();
                    }
                });
            } else if (event.data.type === 'RESUME_GAME') {
                game.scene.scenes.forEach(scene => {
                    if (scene.scene.isPaused()) {
                        scene.scene.resume();
                    }
                });
            }
        });

        // Override GameScene to send score updates
        const originalGameSceneCreate = GameScene.prototype.create;
        GameScene.prototype.create = function() {
            originalGameSceneCreate.call(this);
            
            // Track score changes
            this.events.on('update', () => {
                if (this.score !== tournamentScore) {
                    tournamentScore = this.score;
                    tournamentLives = this.lives;
                    
                    // Send score update to parent
                    window.parent.postMessage({
                        type: 'SCORE_UPDATE',
                        score: tournamentScore,
                        lives: tournamentLives
                    }, '*');
                }
                
                // Check for game over
                if (this.gameOver && !isGameOver) {
                    isGameOver = true;
                    
                    // Send game over to parent
                    window.parent.postMessage({
                        type: 'GAME_OVER',
                        score: tournamentScore
                    }, '*');
                }
            });
        };

        // Override GameOverScene to prevent automatic restarts
        const originalGameOverCreate = GameOverScene.prototype.create;
        GameOverScene.prototype.create = function(data) {
            originalGameOverCreate.call(this, data);
            
            // Send final score to parent
            window.parent.postMessage({
                type: 'GAME_OVER',
                score: data.score || 0
            }, '*');
        };
    </script>
</body>
</html>
