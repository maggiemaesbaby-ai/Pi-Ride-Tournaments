<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pac-Man V2004</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { 
      width: 100%; 
      height: 100dvh; 
      overflow: hidden; 
      background: linear-gradient(135deg, #2d1b69 0%, #1a0f3d 50%, #0a0520 100%);
      font-family: 'Courier New', monospace;
    }
    #game-container { 
      width: 100%; 
      height: 100%; 
      display: flex; 
      align-items: flex-start; 
      justify-content: center; 
      overflow: hidden;
      position: relative;
      /* Added top padding to move game up, removed magnification */
      padding-top: 40px;
    }
    #game-container canvas { 
      image-rendering: pixelated; 
      image-rendering: crisp-edges; 
      /* Ensure canvas fits properly without cutting off */
      max-width: 100%;
      max-height: calc(100% - 200px);
      object-fit: contain;
    }
    
    /* Sidebar styling */
    .game-ui {
      position: absolute;
      color: white;
      font-weight: bold;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
    }
    
    .stats-box {
      background: rgba(0, 0, 0, 0.7);
      border: 2px solid #00ffde;
      border-radius: 8px;
      padding: 12px;
      min-width: 180px;
    }
    
    .stat-label {
      color: #00ffde;
      font-size: 11px;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .stat-value {
      color: white;
      font-size: 18px;
      font-weight: bold;
    }
    
    .lives-display {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    
    .life-icon {
      width: 24px;
      height: 24px;
      background: #ffff00;
      border-radius: 50%;
      position: relative;
    }
    
    .life-icon::before {
      content: '';
      position: absolute;
      top: 50%;
      right: 0;
      width: 50%;
      height: 50%;
      background: linear-gradient(135deg, #2d1b69 0%, #1a0f3d 50%, #0a0520 100%);
      transform-origin: top right;
      border-radius: 0 100% 0 0;
    }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
  <!-- Updated to V2004 with classic arcade styling -->
  <script src="game.js?t=2004000000000"></script>
</body>
</html>
